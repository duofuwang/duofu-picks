name: 同步上游 Release

on:
  schedule:
    - cron: "0,30 0-15,22-23 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "build.py"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 repo.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain -- repo.json appinfo.json icons)" ]; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if [ -d icons ]; then git add icons; fi
          if [ -f appinfo.json ]; then git add appinfo.json; fi
          git commit -m "chore: 同步上游 Release"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "推送失败（第 $attempt 次），15 秒后重试"
            sleep 15
          done
          echo "推送连续失败，本次放弃；下一轮会重新生成"
          exit 1
